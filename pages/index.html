<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlueFlix Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Syne+Mono&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#05060a; --surface:#0c0e16; --border:#181c2c;
    --accent:#e8ff47; --dim:#2a2f45; --text:#eceef8;
    --muted:#454a62; --error:#ff4f6a;
  }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Syne',sans-serif; overflow:hidden; }

  .bg-grid {
    position:fixed; inset:0;
    background-image:linear-gradient(rgba(232,255,71,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(232,255,71,0.03) 1px,transparent 1px);
    background-size:48px 48px; pointer-events:none;
  }
  .screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; transition:opacity 0.4s,transform 0.4s; }
  .screen.hidden { opacity:0; pointer-events:none; transform:scale(0.97); }
  .card { width:400px; background:var(--surface); border:1px solid var(--border); border-radius:4px; overflow:hidden; box-shadow:0 40px 100px rgba(0,0,0,0.7); }
  .card-header { background:var(--accent); padding:20px 28px 18px; display:flex; align-items:baseline; gap:10px; }
  .logo { font-size:22px; font-weight:800; color:#05060a; letter-spacing:-0.5px; }
  .logo-tag { font-family:'Syne Mono',monospace; font-size:10px; color:rgba(5,6,10,0.55); letter-spacing:0.1em; text-transform:uppercase; }
  .card-body { padding:32px 28px 28px; }
  .date-badge { font-family:'Syne Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); border:1px solid rgba(232,255,71,0.2); border-radius:2px; padding:4px 10px; display:inline-block; margin-bottom:24px; }
  .field-label { font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .code-input { width:100%; background:var(--bg); border:1px solid var(--dim); border-radius:3px; padding:14px 16px; font-family:'Syne Mono',monospace; font-size:22px; color:var(--accent); letter-spacing:0.2em; outline:none; text-transform:uppercase; transition:border-color 0.2s; text-align:center; }
  .code-input::placeholder { color:var(--dim); font-size:16px; }
  .code-input:focus { border-color:var(--accent); }
  .error-msg { font-family:'Syne Mono',monospace; font-size:11px; color:var(--error); min-height:20px; margin:10px 0 16px; letter-spacing:0.05em; }
  .btn { width:100%; padding:15px; background:var(--accent); color:#05060a; border:none; border-radius:3px; font-family:'Syne',sans-serif; font-size:13px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:opacity 0.2s,transform 0.1s; }
  .btn:hover { opacity:0.88; }
  .btn:active { transform:scale(0.99); }
  .btn:disabled { opacity:0.3; cursor:not-allowed; transform:none; }
  .progress-wrap { margin-top:16px; display:none; }
  .progress-wrap.visible { display:block; }
  .progress-track { height:2px; background:var(--dim); border-radius:1px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:var(--accent); transition:width 0.3s; border-radius:1px; }
  .progress-label { font-family:'Syne Mono',monospace; font-size:10px; color:var(--muted); margin-top:7px; letter-spacing:0.07em; }

  /* ── File upload drop zone ── */
  .drop-zone {
    width:100%; background:var(--bg); border:1px dashed var(--dim); border-radius:3px;
    padding:28px 16px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; cursor:pointer; transition:border-color 0.2s, background 0.2s; margin-bottom:0;
    position:relative;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color:var(--accent); background:rgba(232,255,71,0.04); }
  .drop-zone input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  .drop-icon { font-size:28px; line-height:1; user-select:none; }
  .drop-primary { font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--text); }
  .drop-secondary { font-family:'Syne Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:0.05em; }
  .file-chosen { display:flex; align-items:center; gap:10px; background:rgba(232,255,71,0.07); border:1px solid rgba(232,255,71,0.25); border-radius:3px; padding:12px 14px; margin-bottom:0; }
  .file-chosen-icon { font-size:18px; flex-shrink:0; }
  .file-chosen-name { font-family:'Syne Mono',monospace; font-size:11px; color:var(--accent); letter-spacing:0.06em; word-break:break-all; flex:1; }
  .file-chosen-clear { font-family:'Syne Mono',monospace; font-size:10px; color:var(--muted); cursor:pointer; white-space:nowrap; flex-shrink:0; padding:2px 6px; border-radius:2px; transition:color 0.15s; }
  .file-chosen-clear:hover { color:var(--error); }

  #video-screen { background:#000; }
  video { width:100vw; height:100vh; object-fit:contain; display:block; }
</style>
</head>
<body>
<div class="bg-grid"></div>

<!-- ── Step 1: File upload ── -->
<div class="screen" id="upload-screen">
  <div class="card">
    <div class="card-header">
      <div class="logo">BlueFlix</div>
      <div class="logo-tag">Secure Player</div>
    </div>
    <div class="card-body">
      <div class="date-badge" id="date-badge-upload">—</div>
      <div class="field-label">Encrypted File</div>

      <!-- Drop zone (shown when no file selected) -->
      <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept=".enc">
        <div class="drop-icon">📦</div>
        <div class="drop-primary">Drop .enc file here</div>
        <div class="drop-secondary">or click to browse</div>
      </div>

      <!-- Chosen file indicator (hidden until file selected) -->
      <div class="file-chosen" id="file-chosen" style="display:none;">
        <div class="file-chosen-icon">🔒</div>
        <div class="file-chosen-name" id="file-chosen-name"></div>
        <div class="file-chosen-clear" id="file-clear" title="Remove file">✕ remove</div>
      </div>

      <div class="error-msg" id="upload-error-msg"></div>
      <button class="btn" id="upload-next-btn" disabled>Continue →</button>
    </div>
  </div>
</div>

<!-- ── Step 2: Code entry ── -->
<div class="screen hidden" id="login-screen">
  <div class="card">
    <div class="card-header">
      <div class="logo">BlueFlix</div>
      <div class="logo-tag">Secure Player</div>
    </div>
    <div class="card-body">
      <div class="date-badge" id="date-badge">—</div>
      <div class="field-label">Daily Access Code</div>
      <input class="code-input" id="code-input" type="text" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" spellcheck="false">
      <div class="error-msg" id="error-msg"></div>
      <button class="btn" id="play-btn">Unlock &amp; Play</button>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-label" id="progress-label"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── Step 3: Video ── -->
<div class="screen hidden" id="video-screen">
  <video id="video" controls autoplay controlsList="nodownload" oncontextmenu="return false;"></video>
</div>

<script>
// ── Constants (must match encryptor.py) ───────────────────────────────────
const PBKDF2_ITERS = 200_000;
const SALT_BYTES   = 32;
const NONCE_BYTES  = 12;
const HEADER_BYTES = SALT_BYTES + 4;

// ── Date ──────────────────────────────────────────────────────────────────
function todayUTC() {
  const d = new Date();
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
const today = todayUTC();
document.getElementById('date-badge-upload').textContent = `Today · ${today}`;
document.getElementById('date-badge').textContent = `Today · ${today}`;

// ── File upload state ─────────────────────────────────────────────────────
let selectedFile = null;

const dropZone       = document.getElementById('drop-zone');
const fileInput      = document.getElementById('file-input');
const fileChosen     = document.getElementById('file-chosen');
const fileChosenName = document.getElementById('file-chosen-name');
const fileClear      = document.getElementById('file-clear');
const uploadNextBtn  = document.getElementById('upload-next-btn');
const uploadErrorMsg = document.getElementById('upload-error-msg');
let encArrayBuffer = null;

function setFile(file) {
  if (!file) { clearFile(); return; }
  if (!file.name.endsWith('.enc')) {
    uploadErrorMsg.textContent = 'File must have a .enc extension.';
    clearFile();
    return;
  }
  uploadErrorMsg.textContent = '';
  selectedFile = file;

  const reader = new FileReader();
  reader.onload = e => { encArrayBuffer = e.target.result; };
  reader.onerror = () => { uploadErrorMsg.textContent = 'Could not read file.'; clearFile(); };
  reader.readAsArrayBuffer(file);

  fileChosenName.textContent = file.name;
  dropZone.style.display  = 'none';
  fileChosen.style.display = 'flex';
  uploadNextBtn.disabled  = false;
}

function clearFile() {
  selectedFile = null;
  encArrayBuffer = null;
  fileInput.value = '';
  dropZone.style.display  = '';
  fileChosen.style.display = 'none';
  uploadNextBtn.disabled  = true;
}

fileInput.addEventListener('change', () => setFile(fileInput.files[0] || null));
fileClear.addEventListener('click', clearFile);

// Drag & drop
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) setFile(f);
});

uploadNextBtn.addEventListener('click', () => {
  if (!selectedFile) return;
  document.getElementById('upload-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('code-input').focus();
});

// ── DOM (code screen) ─────────────────────────────────────────────────────
const codeInput    = document.getElementById('code-input');
const playBtn      = document.getElementById('play-btn');
const errorMsg     = document.getElementById('error-msg');
const progressWrap = document.getElementById('progress-wrap');
const progressFill = document.getElementById('progress-fill');
const progressLabel= document.getElementById('progress-label');
const loginScreen  = document.getElementById('login-screen');
const videoScreen  = document.getElementById('video-screen');
const videoEl      = document.getElementById('video');

// Auto-format XXXX-XXXX
codeInput.addEventListener('input', () => {
  let v = codeInput.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,8);
  if (v.length > 4) v = v.slice(0,4) + '-' + v.slice(4);
  codeInput.value = v;
});
codeInput.addEventListener('keydown', e => { if (e.key==='Enter') playBtn.click(); });

// ── Buffered stream reader (from ArrayBuffer) ─────────────────────────────
// Reads slices of a File on demand — no full preload
function makeFileReader(file) {
  let offset = 0;
  return {
    read(n) {
      return new Promise((resolve, reject) => {
        const slice = file.slice(offset, offset + n);
        if (slice.size < n) { reject(new Error('Unexpected end of file')); return; }
        const fr = new FileReader();
        fr.onload  = e => { offset += n; resolve(new Uint8Array(e.target.result)); };
        fr.onerror = () => reject(new Error('File read error'));
        fr.readAsArrayBuffer(slice);
      });
    }
  };
}

// ── Main unlock ───────────────────────────────────────────────────────────
playBtn.addEventListener('click', async () => {
  const code = codeInput.value.trim().toUpperCase();
  if (code.length !== 9) { showError('Enter the full code (XXXX-XXXX).'); return; }
  if (!selectedFile)     { showError('No .enc file selected — go back.'); return; }

  setLoading(true);
  errorMsg.textContent = '';

  try {
    // 1. Read the uploaded file into an ArrayBuffer
    setProgress(5, 'Reading file…');
    const br = makeFileReader(selectedFile);
    // 2. Read header
    setProgress(10, 'Reading header…');
    const headerBytes = await br.read(HEADER_BYTES);
    const salt        = headerBytes.slice(0, SALT_BYTES);
    const numChunks   = new DataView(headerBytes.buffer).getUint32(SALT_BYTES, false);

    // 3. Derive key
    setProgress(18, 'Deriving key…');
    const enc         = new TextEncoder();
    const keyMaterial = enc.encode(code + ':' + today);
    const keyMat = await crypto.subtle.importKey('raw', keyMaterial, 'PBKDF2', false, ['deriveKey']);
    const aesKey = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations:PBKDF2_ITERS, hash:'SHA-256' },
      keyMat,
      { name:'AES-GCM', length:256 },
      false,
      ['decrypt']
    );

    // 4. Decrypt first chunk to verify password before proceeding
    setProgress(28, 'Verifying key…');
    const nonce0  = await br.read(NONCE_BYTES);
    const len0buf = await br.read(8);
    const len0    = Number(new DataView(len0buf.buffer).getBigUint64(0, false));
    const ct0     = await br.read(len0);
    let firstPlain;
    try {
      firstPlain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:nonce0 }, aesKey, ct0);
    } catch {
      throw new Error('Wrong code or expired key — check today\'s date and code.');
    }

    // 5. Decrypt remaining chunks
    const plainChunks = [firstPlain];
    for (let i = 1; i < numChunks; i++) {
      const nonce  = await br.read(NONCE_BYTES);
      const lenBuf = await br.read(8);
      const len    = Number(new DataView(lenBuf.buffer).getBigUint64(0, false));
      const ct     = await br.read(len);
      const plain  = await crypto.subtle.decrypt({ name:'AES-GCM', iv:nonce }, aesKey, ct);
      plainChunks.push(plain);
      setProgress(30 + Math.round((i / numChunks) * 65), `Decrypting ${i+1} / ${numChunks}…`);
    }

    // 6. Build blob
    setProgress(97, 'Loading player…');
    const mainBlobUrl = URL.createObjectURL(new Blob(plainChunks, { type: 'video/mp4' }));

    setProgress(100, 'Ready!');
    await sleep(150);

    // 7. Switch screens
    loginScreen.classList.add('hidden');
    videoScreen.classList.remove('hidden');

    // 8. Play intro then main
    const INTRO = 'data/intro.mp4';
    videoEl.src = INTRO;
    const introOk = await new Promise(resolve => {
      videoEl.addEventListener('canplay', () => resolve(true),  { once: true });
      videoEl.addEventListener('error',   () => resolve(false), { once: true });
      videoEl.play().catch(() => resolve(false));
    });

    if (introOk) {
      videoEl.addEventListener('ended', () => {
        videoEl.src = mainBlobUrl;
        videoEl.play().catch(() => {});
      }, { once: true });
    } else {
      videoEl.src = mainBlobUrl;
      videoEl.play().catch(() => {});
    }

  } catch(err) {
    showError(err.message);
    setLoading(false);
    loginScreen.classList.remove('hidden');
    videoScreen.classList.add('hidden');
  }
});

function setLoading(on) {
  playBtn.disabled = on;
  playBtn.textContent = on ? 'Working…' : 'Unlock & Play';
  progressWrap.classList.toggle('visible', on);
  if (!on) { progressFill.style.width='0%'; progressLabel.textContent=''; }
}
function setProgress(pct, label) {
  progressFill.style.width = pct+'%';
  progressLabel.textContent = label;
}
function showError(msg) { errorMsg.textContent = msg; codeInput.focus(); }
function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }
</script>

</body>
</html>
